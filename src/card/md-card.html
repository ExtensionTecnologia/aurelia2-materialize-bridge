<div ref="card" class="card ${size} ${mdClass}" horizontal.class="horizontal" sticky-action.class="stickyAction">
  <div if.bind="image" class="card-image">
    <img activator.class="reveal" src.bind="image" alt.bind="mdTitle">
    <span if.bind="!reveal" class="card-title">${mdTitle}</span>
  </div>
  <div class="card-content">
    <span if.bind="reveal" class="card-title activator">${mdTitle}<i class="material-icons right">more_vert</i></span>
    <span if.bind="!image && !reveal" class="card-title">${mdTitle}</span>
    <au-slot></au-slot>
  </div>
  <div if.bind="reveal" class="card-reveal">
    <span class="card-title">${mdTitle}<i class="material-icons right">close</i></span>
    <au-slot name="reveal-text"></au-slot>
  </div>
  <div if.bind="action" class="card-action">
    <au-slot name="action"></au-slot>
  </div>
</div>
